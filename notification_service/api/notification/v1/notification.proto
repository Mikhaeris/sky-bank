syntax = "proto3";

package api.notification.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/mikhaeris/sky-bank/notification_service/api/notification/v1;notificationv1";

service NotificationService {
  rpc SendOtpCode (SendOtpCodeRequest) returns (google.protobuf.Empty);
}

message SendOtpCodeRequest {
  string email = 1;
  string otp_code = 2;
}
