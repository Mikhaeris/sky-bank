syntax = "proto3";

package auth.v1;

import "google/api/annotations.proto";

option go_package = "github.com/mikhaeris/sky-bank/auth_service";

service AuthSerice {
    rpc RegisterUser(RegisterRequest) returns (RegisterResponse);
}

message Tokens {
    access_token = 1;
    refresh_token = 2;
}

message RegisterRequest {
    string email = 1;
    string password = 2;
}

message RegisterResponse {
    string userUUID = 1;
    Tokens tokens = 2;
}
