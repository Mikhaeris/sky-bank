services:
  gateway:
    build: gateway/
    command: ./gateway
    container_name: gateway
    ports:
      - "8081:8081"
    depends_on:
      auth:
        condition: service_started
    volumes:
      - ./secrets/keys/public.pem:/keys/public.pem:ro


  auth:
    build: auth_service/
    command: ./auth
    container_name: auth
    ports:
      - "9000:9000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      notification:
        condition: service_started
    volumes:
      - ./secrets/keys/private.pem:/keys/private.pem:ro
      - ./secrets/otp.key:/secrets/otp.key:ro


  notification:
    build: notification_service/
    command: ./notification
    container_name: notification
    ports:
      - "9001:9001"
    depends_on:
      mailpit:
        condition: service_healthy

  # dev workflow only
  mailpit:
    image: axllent/mailpit:latest
    container_name: sky-bank-mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    volumes:
      - mailpit_data:/data
    ports:
      - "8025:8025"
    expose:
      - "1025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
      image: migrate/migrate:v4.19.0
      volumes:
        - ./auth_service/migrations:/migrations:ro
      command:
        - "-path=/migrations"
        - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
        - "up"
      depends_on:
        postgres:
          condition: service_healthy

volumes:
  postgres_data:
  mailpit_data:
