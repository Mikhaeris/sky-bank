x-kafka-common: &kafka-common
  image: apache/kafka:4.3.1
  healthcheck:
    test:
      - CMD
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - localhost:9092
      - --list
    interval: 10s
    timeout: 10s
    retries: 10
    start_period: 30s

x-kafka-env: &kafka-env
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    command: ./gateway
    container_name: gateway
    ports:
      - "8081:8081"
    depends_on:
      auth:
        condition: service_started
      customer:
        condition: service_started
    volumes:
      - ./secrets/keys/public.pem:/keys/public.pem:ro

  auth:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    command: ./auth
    container_name: auth
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      notification:
        condition: service_started
      tempo:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    volumes:
      - ./secrets/keys/private.pem:/keys/private.pem:ro
      - ./secrets/otp.key:/secrets/otp.key:ro

  customer:
    build:
      context: .
      dockerfile: customer_service/Dockerfile
    command: ./customer
    container_name: customer
    depends_on:
      customer-migrate:
        condition: service_completed_successfully
      notification:
        condition: service_started
      auth:
        condition: service_started
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  notification:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    command: ./notification
    container_name: notification
    depends_on:
      mailpit:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  # Local development Kafka cluster
  kafka-1:
    <<: *kafka-common
    ports:
      - "29092:29092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-1:9092,EXTERNAL://localhost:29092"
    volumes:
      - kafka_1_data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka-common
    ports:
      - "39092:29092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-2:9092,EXTERNAL://localhost:39092"
    volumes:
      - kafka_2_data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka-common
    ports:
      - "49092:29092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-3:9092,EXTERNAL://localhost:49092"
    volumes:
      - kafka_3_data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - ":8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "sky-bank-local"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "4318:4318"

  grafana:
    image: grafana/grafana:12.4.11
    depends_on:
      tempo:
        condition: service_started
    volumes:
      - ./infra/grafana/provisioning/datasources/tempo.yaml:/etc/grafana/provisioning/datasources/tempo.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  # dev workflow only
  mailpit:
    image: axllent/mailpit:latest
    container_name: sky-bank-mailpit
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    volumes:
      - mailpit_data:/data
    ports:
      - "8025:8025"
    expose:
      - "1025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  auth-migrate:
    image: migrate/migrate:v4.19.0
    volumes:
      - ./auth_service/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@postgres:5432/${AUTH_DB}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  customer-migrate:
    image: migrate/migrate:v4.19.0
    volumes:
      - ./customer_service/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${CUSTOMER_DB_USER}:${CUSTOMER_DB_PASSWORD}@postgres:5432/${CUSTOMER_DB}?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
  mailpit_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  tempo_data:
  grafana_data:
